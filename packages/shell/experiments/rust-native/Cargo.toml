[package]
name = "twill-native-experiment"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.90"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "=0.2.190"
napi = { version = "=3.14.2", default-features = false, features = ["napi6"] }
napi-derive = "=3.6.12"

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
