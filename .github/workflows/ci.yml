name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm deps:check
      - run: pnpm check
      - run: pnpm format:check
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm test:coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm package:core
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node packages/twill/tests/consumer.mjs --packed
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm package:tooling && node packages/formatter/tests/consumer.mjs && node packages/linter/tests/consumer.mjs && node packages/migrate/tests/consumer.mjs
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm release:manifest && pnpm --filter @swiftuijs/twill test:size --output ../../bundle-results.json
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm benchmark --output benchmark-results.json
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm benchmark:project --output project-results.json
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm benchmark:branching --output branching-results.json
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v7.0.1
        with:
          name: twill-packages
          path: |
            *.tgz
            dist/twill.vsix
            packages/*/coverage/
            benchmark-results.json
            project-results.json
            release-manifest.json
            bundle-results.json
            branching-results.json
  node20-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:core
      - run: pnpm --filter @swiftuijs/twill-formatter --filter @swiftuijs/twill-linter run build
      - run: pnpm package:tooling
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      # Vitest 5 and VSCE 4 require Node 22. The distributed compiler, loader,
      # type checker and build adapters also support Node 20 consumers.
      - run: node packages/twill/tests/consumer.mjs --packed
      - run: node packages/formatter/tests/consumer.mjs && node packages/linter/tests/consumer.mjs && node packages/migrate/tests/consumer.mjs
  editor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.95.3', stable]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm editor:package
      - run: xvfb-run -a pnpm editor:test
        env:
          TWILL_TEST_VSCODE_VERSION: ${{ matrix.vscode }}
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm --filter @swiftuijs/twill-docs exec playwright install --with-deps chromium
      - run: pnpm test:browser
        env:
          TWILL_BROWSER_OUTPUT: ${{ runner.temp }}/twill-browser-results
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-results
          path: ${{ runner.temp }}/twill-browser-results/
