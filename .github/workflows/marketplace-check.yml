name: Marketplace credentials
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check credential availability
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::error::VSCE_PAT is missing. Configure it as a repository Actions secret.'
            exit 1
          fi
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install the verification tool
        run: npm install --prefix "$RUNNER_TEMP/twill-vsce" --no-save --ignore-scripts @vscode/vsce@4.0.0
      - name: Verify PAT and publisher access
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          node "$RUNNER_TEMP/twill-vsce/node_modules/@vscode/vsce/vsce" verify-pat forth-ink
          echo 'VSCE verified PAT authentication and access to publisher forth-ink. No extension was published.' >> "$GITHUB_STEP_SUMMARY"
