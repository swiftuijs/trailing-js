name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      minimum-editor: true
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: twill-packages
          path: artifacts
      - run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes artifacts/*.tgz artifacts/dist/twill.vsix artifacts/release-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
