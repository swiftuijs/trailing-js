name: Extended validation
on:
  workflow_dispatch:
    inputs:
      compatibility:
        description: Windows, macOS, Node 24 and minimum VS Code checks
        type: boolean
        default: true
      benchmarks:
        description: Collect compiler, project, branching, enum, runtime, shell and React source timings
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    if: inputs.compatibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
          - { os: ubuntu-24.04, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  minimum-editor:
    if: inputs.compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm editor:package
      - run: xvfb-run -a pnpm editor:test
        env:
          TWILL_TEST_VSCODE_VERSION: '1.95.3'
  benchmarks:
    if: inputs.benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swiftuijs/twill-formatter... --filter @swiftuijs/twill-shell... run build
      - run: pnpm benchmark --output benchmark-results.json
      - run: pnpm benchmark:project --output project-results.json
      - run: pnpm benchmark:branching --output branching-results.json
      - run: pnpm benchmark:enum-patterns --output enum-patterns-results.json
      - run: pnpm benchmark:runtime --output runtime-results.json
      - run: pnpm benchmark:shell --output ../../shell-results.json
      - run: pnpm benchmark:react-framework --output ../../react-framework-results.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-results
          if-no-files-found: error
          path: |
            benchmark-results.json
            project-results.json
            branching-results.json
            enum-patterns-results.json
            runtime-results.json
            shell-results.json
            react-framework-results.json
