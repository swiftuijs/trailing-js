name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'skills/**'
      - 'apps/docs/**'
      - 'packages/twill/**'
      - 'packages/runtime/**'
      - 'packages/shell/**'
      - 'packages/shell-native/**'
      - 'scripts/generate-runtime-helper.mjs'
      - 'packages/formatter/**'
      - 'packages/highlight/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.npmrc'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Pages configuration
        id: pages
        shell: bash
        run: |
          pages_config=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null || true)
          if [ -z "$pages_config" ]; then pages_config='{}'; fi
          pages_mode=$(jq -r '.build_type // empty' <<< "$pages_config")
          pages_domain=$(jq -r '.cname // empty' <<< "$pages_config")
          if [ "$pages_mode" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo 'The built documentation is available as an artifact. Enable Pages with GitHub Actions as its source, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$pages_domain" ]; then
            echo "base-path=/" >> "$GITHUB_OUTPUT"
          else
            echo "base-path=/twill/" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm docs:build
        env:
          TWILL_DOCS_BASE: ${{ steps.pages.outputs.base-path }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: documentation-site
          path: apps/docs/dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist
          include-hidden-files: true
  deploy:
    needs: build
    if: needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
